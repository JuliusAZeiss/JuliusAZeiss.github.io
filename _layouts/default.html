<!doctype html>
<html lang="en" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.url == '/' %}{{ site.title | escape }} · Quantum Information Theory{% else %}{{ page.title | strip_html | escape }} · {{ site.title | escape }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: page.subtitle | default: site.description | strip_html | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta name="theme-color" content="#f8f7f3">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | strip_html | escape }}">
  <meta property="og:description" content="{{ page.description | default: page.subtitle | default: site.description | strip_html | escape }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/images/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/design.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title | escape }}">
  <script>document.documentElement.className='js';</script>
  <script defer src="{{ '/assets/js/design.js' | relative_url }}"></script>
  {% if page.url == '/' %}<script defer src="{{ '/assets/js/graph-coloring.js' | relative_url }}"></script>{% endif %}{% if page.mathjax %}
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>{% endif %}
</head>
<body class="no-portrait{% if page.url == '/' %} home-page{% else %} inner-page{% endif %}">
  <a class="skip" href="#main">Skip to content</a>
  {% include design-header.html %}
  <main id="main" tabindex="-1">{{ content }}</main>
  {% include design-footer.html %}
  {% include analytics.html %}
</body>
</html>
