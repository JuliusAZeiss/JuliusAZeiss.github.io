{% if post.title %}
<article class="entry-row">
  <div class="entry-date">{% if post.date %}{{ post.date | date: '%Y' }}{% endif %}</div>
  <div class="entry-body"><h2 class="entry-title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>{% if post.excerpt %}<div class="entry-summary">{{ post.excerpt | markdownify }}</div>{% endif %}</div>
</article>
{% endif %}
