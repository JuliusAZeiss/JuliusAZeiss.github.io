name: Validate website

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Build Jekyll site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production
      - name: Check pages and archive exclusion
        run: |
          ruby <<'RUBY'
          required = %w[index.html research/index.html publications/index.html talks/index.html teaching/index.html cv/index.html portfolio/index.html workshop/index.html assets/css/design.css assets/js/design.js]
          missing = required.reject { |path| File.file?(File.join('_site', path)) }
          abort "Missing output: #{missing.join(', ')}" unless missing.empty?
          abort 'The old-site backup must not be published' if File.exist?('_site/_archive')
          abort 'The local preview guide must not be published' if File.exist?('_site/preview')
          puts 'Main pages present; backup and preview guide excluded.'
          RUBY
